name: Capture pregame MLB odds

on:
  workflow_dispatch:
  schedule:
    # 15 runs per Eastern game day, 11:07 AM–1:07 AM during EDT.
    # GitHub Actions evaluates cron in UTC.
    - cron: "7 15-23 * 4-10 *"
    - cron: "7 0-5 * 4-10 *"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: Capture odds snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/capture_pregame_odds.py

      - name: Commit updated odds history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data_files/processed/pregame_odds_snapshots.parquet

          if git diff --cached --quiet; then
            echo "No new odds data to commit."
            exit 0
          fi

          git commit -m "Capture pregame odds snapshot"

          git pull --rebase origin main
          git push origin HEAD:main
